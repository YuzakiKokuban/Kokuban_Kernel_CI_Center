name: Local Mode Check

on:
  push:
    branches:
      - main
    # ci_core_rs pushes are already fully gated by build_ci_core.yml (fmt/clippy/test)
    # before it publishes ci-core-latest; re-running the same Rust gates here just
    # doubles Actions usage. Pull requests still run everything.
    paths-ignore:
      - 'ci_core_rs/**'
  pull_request:

# Superseded runs on the same ref are dropped instead of queueing up.
concurrency:
  group: local-mode-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        # Must match rust-toolchain.toml; see build_ci_core.yml for why the channel is pinned.
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Rust format
        run: cargo fmt --manifest-path ci_core_rs/Cargo.toml --check

      - name: Rust check
        run: cargo check --manifest-path ci_core_rs/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path ci_core_rs/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path ci_core_rs/Cargo.toml

      - name: Wrapper tests
        run: |
          ./scripts/check-shell.sh
          ./scripts/test-kokuban-cli.sh

      - name: Kokuban validation
        run: |
          ./kokuban validate
          ./kokuban plan s23_sm8550 main default --no-susfs --no-bbg

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build local image
        run: docker build -t kokuban-local .

      - name: Smoke test in container
        run: |
          docker run --rm -v "$PWD":/workspace kokuban-local ./kokuban validate
          docker run --rm -v "$PWD":/workspace kokuban-local ./kokuban plan s23_sm8550 main default --no-susfs --no-bbg
