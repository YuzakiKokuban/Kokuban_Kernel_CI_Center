name: Add New Project
on:
  workflow_dispatch:
    inputs:
      project_key:
        description: 'Project Key'
        required: true
      repo_path:
        description: 'GitHub Repo (User/Repo)'
        required: true
      defconfig:
        description: 'Defconfig Name'
        required: true
      localversion:
        description: 'Localversion Base'
        required: true
      device_name_cn:
        description: 'Device Name (CN)'
        required: true
        default: '未知设备'
      device_name_en:
        description: 'Device Name (EN)'
        required: true
        default: 'Unknown Device'
      ak3_config:
        description: 'AnyKernel3 config key in configs/anykernel_configs.json (optional)'
        required: false
        default: ''
      zip_name:
        description: 'Zip Name Prefix'
        default: 'Kernel'
        required: true

jobs:
  add-project:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download CI Core
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ./scripts/fetch-ci-core.sh

      - name: Add to Configuration
        env:
          PROJECT_KEY: ${{ inputs.project_key }}
          REPO_PATH: ${{ inputs.repo_path }}
          DEFCONFIG: ${{ inputs.defconfig }}
          LOCALVERSION: ${{ inputs.localversion }}
          DEVICE_NAME_CN: ${{ inputs.device_name_cn }}
          DEVICE_NAME_EN: ${{ inputs.device_name_en }}
          AK3_CONFIG: ${{ inputs.ak3_config }}
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          # --localversion is joined with '=' on purpose: the configured values start with
          # '-', so a space-separated form would be parsed as a separate (unknown) flag.
          ARGS=(
            --key="$PROJECT_KEY"
            --repo="$REPO_PATH"
            --defconfig="$DEFCONFIG"
            --localversion="$LOCALVERSION"
            --device-cn="$DEVICE_NAME_CN"
            --device-en="$DEVICE_NAME_EN"
            --zip-name="$ZIP_NAME"
          )
          if [ -n "$AK3_CONFIG" ]; then
            ARGS+=(--ak3-config="$AK3_CONFIG")
          fi
          ./kokuban_ci_core add "${ARGS[@]}"

      - name: Commit and Push
        env:
          PROJECT_KEY: ${{ inputs.project_key }}
        run: |
          git config --global user.name "Kokuban-Bot"
          git config --global user.email "bot@kokuban.dev"
          git add configs/projects.json
          git commit -m "feat: add new project $PROJECT_KEY"
          git push
