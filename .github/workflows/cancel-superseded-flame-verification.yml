name: Cancel superseded Pixel 4 verification
on:
  push:
    branches: [pixelos17-cnb-ci]
    paths: [.github/workflows/cancel-superseded-flame-verification.yml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only the superseded verification started for afa3160
        run: gh run cancel 43807012860 --repo YuzakiKokuban/Kokuban_Kernel_CI_Center
