name: Manual Update KernelSU
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to update'
        required: true
        type: choice
        options: [z5_sm8550, s25_sm8750, s23_sm8550, tabs9_sm8550, s24_sm8650, tabs10_mt6989, z6_sm8650, mi17_sm8850, razrfold_sm8845]
      branch:
        description: 'Variant (KernelSU Type)'
        required: true
        type: choice
        options: [resukisu]
      commit_id:
        description: 'Commit Short Hash (Optional, defaults to latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download CI Core
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ./scripts/fetch-ci-core.sh

      - name: Determine Commit Hash
        id: hash
        env:
          INPUT_COMMIT_ID: ${{ inputs.commit_id }}
        run: |
          set -euo pipefail

          if [ "$INPUT_COMMIT_ID" = "latest" ]; then
            repo="https://github.com/ReSukiSU/ReSukiSU.git"
            branch="main"
            echo "COMMIT_ID=$(git ls-remote "$repo" "$branch" | cut -c1-7)" >> "$GITHUB_ENV"
          else
            echo "COMMIT_ID=$INPUT_COMMIT_ID" >> "$GITHUB_ENV"
          fi

      - name: Execute Update
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          ./kokuban_ci_core update \
            --token "$GH_TOKEN" \
            --project "$INPUT_PROJECT" \
            --variant "$INPUT_BRANCH" \
            --commit-id "$COMMIT_ID"
