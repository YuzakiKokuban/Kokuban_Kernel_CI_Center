# .github/workflows/reusable-update-kernel-source.yml
name: Reusable - Update Kernel Source
on:
  workflow_call:
    inputs:
      projects_json:
        description: 'JSON string of projects to update. Format: [{"key": "s23", "repo": "Y/s23"}]'
        required: true
        type: string
      ksu_type:
        description: 'The type of KernelSU to update (bakasu only)'
        required: true
        type: string
      latest_commit_short:
        description: 'Upstream commit SHA (full SHA preferred; legacy short SHA is resolved once)'
        required: true
        type: string
      commit_message:
        description: 'The commit message for the update'
        required: true
        type: string
    secrets:
      ADMIN_TOKEN:
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Central Repo utility files
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            configs/universal.gitignore
            configs/projects.json
            configs/bakasu
            scripts/bakasu-hooks.py
          sparse-checkout-cone-mode: false

      - name: Update Kernel Source for each project
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PROJECTS_TO_UPDATE: ${{ inputs.projects_json }}
          KSU_TYPE: ${{ inputs.ksu_type }}
          LATEST_COMMIT_SHORT: ${{ inputs.latest_commit_short }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          # --- Configuration ---
          if [[ "$KSU_TYPE" != "bakasu" ]]; then
            echo "Unsupported ksu_type: $KSU_TYPE"
            exit 1
          fi
          if [[ -z "$ADMIN_TOKEN" ]]; then
            echo "::error::ADMIN_TOKEN is required with write access to the kernel source repositories"
            exit 1
          fi
          if [[ ! "$LATEST_COMMIT_SHORT" =~ ^[[:xdigit:]]{7,40}$ ]]; then
            echo "::error::Expected an upstream commit SHA"
            exit 1
          fi
          # Resolve historical short-SHA callers once, then use the immutable full SHA
          # for both setup.sh itself and the source revision that setup.sh installs.
          UPSTREAM_COMMIT=$(GH_TOKEN="$ADMIN_TOKEN" gh api "repos/Baka-SU/BakaSU/commits/$LATEST_COMMIT_SHORT" --jq '.sha')
          if [[ ! "$UPSTREAM_COMMIT" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::Could not resolve a full upstream commit SHA"
            exit 1
          fi
          SETUP_URL="https://raw.githubusercontent.com/Baka-SU/BakaSU/$UPSTREAM_COMMIT/kernel/setup.sh"

          echo "Updating projects with commit message: '$COMMIT_MESSAGE'"
          
          # Loop through projects passed as JSON
          echo "$PROJECTS_TO_UPDATE" | jq -c '.[]' | while read -r project; do
            PROJECT_KEY=$(echo "$project" | jq -r '.key')
            PROJECT_REPO=$(echo "$project" | jq -r '.repo')

            echo "--> Processing update for project: $PROJECT_KEY"
            
            git clone --depth=1 --branch "$KSU_TYPE" "https://x-access-token:$ADMIN_TOKEN@github.com/$PROJECT_REPO.git" "temp_kernel"
            cd temp_kernel

            if [[ -f ci/pixelos17.json ]]; then
              echo "Pinned PixelOS ROM kernel: keep its reviewed BakaSU/SUSFS source unchanged."
              cd ..
              rm -rf temp_kernel
              continue
            fi

            echo "Writing version file: $UPSTREAM_COMMIT"
            echo "$UPSTREAM_COMMIT" > KERNELSU_VERSION.txt

            echo "Syncing .gitignore file..."
            cp ${{ github.workspace }}/configs/universal.gitignore ./.gitignore

            echo "Running setup.sh from $SETUP_URL..."
            curl -fLSs "$SETUP_URL" -o "$RUNNER_TEMP/bakasu-setup.sh"
            bash "$RUNNER_TEMP/bakasu-setup.sh" "$UPSTREAM_COMMIT"
            INSTALLED_COMMIT=$(git -C KernelSU rev-parse HEAD)
            if [[ "$INSTALLED_COMMIT" != "$UPSTREAM_COMMIT" ]]; then
              echo "::error::setup.sh did not install the requested upstream revision"
              exit 1
            fi
            DEFCONFIG=$(jq -er --arg key "$PROJECT_KEY" '.[$key].defconfig' "$GITHUB_WORKSPACE/configs/projects.json")
            python3 "$GITHUB_WORKSPACE/scripts/bakasu-hooks.py" \
              --source "$PWD" --project "$PROJECT_KEY" --defconfig "$DEFCONFIG"
            
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"

            if [[ -n $(git status --porcelain) ]]; then
              git add .
              git commit -m "$COMMIT_MESSAGE"
              git push
            else
              echo "No file changes for $PROJECT_KEY, skipping push."
            fi

            cd .. && rm -rf temp_kernel
          done
