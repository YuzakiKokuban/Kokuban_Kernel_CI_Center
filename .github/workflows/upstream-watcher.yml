name: Watch Upstream KernelSU
on:
  schedule:
    # Weekly wave (Mondays 00:00 UTC). Detection cadence == build cadence on purpose:
    # one wave per week keeps Actions usage flat and avoids bursts of upstream traffic.
    - cron: '0 0 * * 1'
  # Manual escape hatch: run a wave immediately without waiting for Monday.
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Check upstream detection and source repository access without updating or building'
        type: boolean
        default: false

# A scheduled/manual wave must finish before another wave can observe its tracker.
concurrency:
  group: upstream-wave-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.watcher.outputs.matrix }}
      found_updates: ${{ steps.watcher.outputs.found_updates }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust for preview waves
        if: github.ref != 'refs/heads/main'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.92.0

      - name: Build preview CI Core
        if: github.ref != 'refs/heads/main'
        run: |
          cargo build --release --locked --manifest-path ci_core_rs/Cargo.toml
          cp ci_core_rs/target/release/kokuban_ci_core ./kokuban_ci_core

      - name: Download CI Core
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ./scripts/fetch-ci-core.sh
      - name: Check Upstream
        id: watcher
        run: ./kokuban_ci_core watch

      - name: Verify source repository access without changes
        if: inputs.verify_only
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          UPDATE_MATRIX: ${{ steps.watcher.outputs.matrix }}
        run: |
          set -euo pipefail
          pending_count=$(jq 'length' <<< "$UPDATE_MATRIX")
          printf 'Verification only: %s pending project updates. No sources, builds, releases or tracker records changed.\n' "$pending_count" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN is required to verify source repository access"
            exit 1
          fi
          failed=0
          while IFS=$'\t' read -r project repo; do
            if ! permission=$(gh api "repos/$repo" --jq '.permissions.push' 2>/dev/null); then
              printf '%s %s status=repository-unavailable\n' "$project" "$repo"
              failed=1
              continue
            fi
            if [ "$permission" != true ]; then
              printf '%s %s status=push-permission-missing\n' "$project" "$repo"
              failed=1
              continue
            fi
            if ! branch_sha=$(gh api "repos/$repo/git/ref/heads/bakasu" --jq '.object.sha' 2>/dev/null) || [[ ! "$branch_sha" =~ ^[[:xdigit:]]{40}$ ]]; then
              printf '%s %s status=bakasu-branch-unavailable\n' "$project" "$repo"
              failed=1
              continue
            fi
            printf '%s %s status=push-permission-and-bakasu-branch-verified\n' "$project" "$repo"
          done < <(jq -r 'to_entries[] | select(.key | startswith("_") | not) | [.key, .value.repo] | @tsv' configs/projects.json)
          exit "$failed"

  # Serialized fan-out: one kernel repo updated at a time (no burst of clones/pushes).
  update-projects:
    needs: check
    if: ${{ !inputs.verify_only && needs.check.outputs.found_updates == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust for preview waves
        if: github.ref != 'refs/heads/main'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.92.0

      - name: Build preview CI Core
        if: github.ref != 'refs/heads/main'
        run: |
          cargo build --release --locked --manifest-path ci_core_rs/Cargo.toml
          cp ci_core_rs/target/release/kokuban_ci_core ./kokuban_ci_core

      - name: Download CI Core
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ./scripts/fetch-ci-core.sh
      - name: Verify source update credentials
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN is required with write access to the kernel source repositories"
            exit 1
          fi

      - name: Perform Update
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MATRIX_PROJECT: ${{ matrix.project }}
          MATRIX_VARIANT: ${{ matrix.variant }}
          MATRIX_COMMIT_ID: ${{ matrix.commit_id }}
        run: |
          ./kokuban_ci_core update \
            --token "$GH_TOKEN" \
            --project "$MATRIX_PROJECT" \
            --variant "$MATRIX_VARIANT" \
            --commit-id "$MATRIX_COMMIT_ID"

  # The wave's build stage. The update commits carry "[skip ci]", so a kernel repo's
  # own Trigger Central Build no longer fires: this job is what starts the builds,
  # strictly one at a time, from the central repo.
  build-projects:
    needs: [check, update-projects]
    if: ${{ !inputs.verify_only && needs.check.outputs.found_updates == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}
    uses: ./.github/workflows/build_kernel.yml
    with:
      project: ${{ matrix.project }}
      branch: ${{ matrix.variant }}
      ksu_variant: default
      do_release: true
      apply_bbg: false
      apply_hybridmount: true
      apply_susfs: auto
      bakasu_setup_arg: ${{ matrix.commit_id }}
    secrets: inherit

  acknowledge-wave:
    needs: [check, update-projects, build-projects]
    if: ${{ !inputs.verify_only && needs.check.outputs.found_updates == 'true' && needs.update-projects.result == 'success' && needs.build-projects.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Rust for preview waves
        if: github.ref != 'refs/heads/main'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.92.0

      - name: Build preview CI Core
        if: github.ref != 'refs/heads/main'
        run: |
          cargo build --release --locked --manifest-path ci_core_rs/Cargo.toml
          cp ci_core_rs/target/release/kokuban_ci_core ./kokuban_ci_core

      - name: Download CI Core
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./scripts/fetch-ci-core.sh

      - name: Record successful wave
        env:
          UPDATE_MATRIX: ${{ needs.check.outputs.matrix }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$UPDATE_MATRIX" > /tmp/upstream-wave.json
          ./kokuban_ci_core ack-upstream --matrix-file /tmp/upstream-wave.json
          git config user.name "Kokuban-Watcher"
          git config user.email "watcher@kokuban.dev"
          git add configs/upstream_commits.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: acknowledge successful upstream wave"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
