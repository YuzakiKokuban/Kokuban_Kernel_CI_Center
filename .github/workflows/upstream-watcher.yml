name: Watch Upstream KernelSU
on:
  schedule:
    # Weekly wave (Mondays 00:00 UTC). Detection cadence == build cadence on purpose:
    # one wave per week keeps Actions usage flat and avoids bursts of upstream traffic.
    - cron: '0 0 * * 1'
  # Manual escape hatch: run a wave immediately without waiting for Monday.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.watcher.outputs.matrix }}
      found_updates: ${{ steps.watcher.outputs.found_updates }}
    steps:
      - uses: actions/checkout@v7

      - name: Download CI Core
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ./scripts/fetch-ci-core.sh
      - name: Check Upstream
        id: watcher
        run: ./kokuban_ci_core watch
        
      - name: Commit Updated Tracker
        if: steps.watcher.outputs.found_updates == 'true'
        run: |
          git config --global user.name "Kokuban-Watcher"
          git config --global user.email "watcher@kokuban.dev"
          git add configs/upstream_commits.json
          git commit -m "ci: update upstream records"
          git push

  # Serialized fan-out: one kernel repo updated at a time (no burst of clones/pushes).
  update-projects:
    needs: check
    if: needs.check.outputs.found_updates == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download CI Core
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ./scripts/fetch-ci-core.sh
      - name: Perform Update
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MATRIX_PROJECT: ${{ matrix.project }}
          MATRIX_VARIANT: ${{ matrix.variant }}
          MATRIX_COMMIT_ID: ${{ matrix.commit_id }}
        run: |
          ./kokuban_ci_core update \
            --token "$GH_TOKEN" \
            --project "$MATRIX_PROJECT" \
            --variant "$MATRIX_VARIANT" \
            --commit-id "$MATRIX_COMMIT_ID"

  # The wave's build stage. The update commits carry "[skip ci]", so a kernel repo's
  # own Trigger Central Build no longer fires: this job is what starts the builds,
  # strictly one at a time, from the central repo.
  build-projects:
    needs: [check, update-projects]
    if: needs.check.outputs.found_updates == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}
    uses: ./.github/workflows/build_kernel.yml
    with:
      project: ${{ matrix.project }}
      branch: ${{ matrix.variant }}
      ksu_variant: default
      do_release: true
      apply_susfs: true
      apply_bbg: false
      apply_hybridmount: true
    secrets: inherit
